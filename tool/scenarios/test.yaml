  # - expect_text: "Not logged in"
  # - expect_button: Login
  # - tap: { title: Login }
  # - probe_until: { text: "Logged in as Alice", timeout_s: 10 }
  # - probe_until: { text: "Login count: 1", timeout_s: 10 }
  # - tap: { title: Logout }
  # - probe_until: { text: "Not logged in", timeout_s: 10 }

