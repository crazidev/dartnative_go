# Real-device scenario for the example/ guest app (Riverpod login flow).
# Needs: `dart_go start` in example/ + app connected with guest mounted.
# Needs a device: run with --server http://<lan-ip>:<port>
# (Fake mode is rejected: no fake: block by design.)
name: example-login-reload
server: http://192.168.3.159:8088
project_dir: ./example
defaults: { step_timeout_s: 10, probe_interval_ms: 300 }

steps:
  - restart: { text: "Your board is empty", timeout_s: 30 }
  - probe: {}
  - expect_text: "Your board is empty"
  - expect_icon: CupertinoIcons.plus
  - tap: CupertinoIcons.plus

  # Wait for bottom sheet to present
  - probe_until: { text: "New note", timeout_s: 3 }

  # Type note title & description
  - type: { into: "Note title", text: "Buy groceries" }
  - type: { into: "Add a description", text: "Organic milk and apples" }
  # - tap: CupertinoIcons.xmark
  # Tap Create button to save note and dismiss bottom sheet
  - tap: { title: "Create" }

  # Verify the new note appears on the board
  - probe_until: { text: "Buy groceries", timeout_s: 5 }
  - expect_text: "Buy groceries"
  - expect_text: "Organic milk and apples"
