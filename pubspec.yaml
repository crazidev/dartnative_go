name: dartnative_go
description: "A new DartNative project."
publish_to: "none"
version: 0.1.0+1

workspace:
  - example

environment:
  sdk: ^3.9.0-0

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  # == Supported plugins starts ===
  native_bottomsheet:
    path: ../dartnative_bottomsheet
  dartnative_share: ^1.0.0
  dartnative_webview: ^1.0.0
  dartnative_shared_preferences: ^1.0.0
  dartnative_path_provider: ^1.0.0
  dartnative_url_launcher: ^1.0.0
  dartnative_splash: ^1.0.0
  dartnative_notifications: ^1.0.0
  dartnative_system: ^1.0.0
  dartnative_connectivity: ^1.0.0
  dartnative_media_picker: ^1.1.0
  dartnative_background: ^1.0.0
  app_links_kit:
    hosted: https://dartpub.dev
    version: ^0.1.0
  crypto: ^3.0.0
  dio: ^5.0.0
  riverpod_kit:
    hosted: https://dartpub.dev
    version: ^0.1.0
  riverpod: ^3.3.2
  # == Supported plugins ends ===
  tom_d4rt: any
  tom_d4rt_ast: any
  tom_ast_model: any
  analyzer: any
  yaml: ^3.1.2
  dartnative_shadcn:
    path: ../dartnative_shadcn

dev_dependencies:
  lints: ^6.0.0
  image: 4.3.0
  test: any
  tom_d4rt_generator: any
  tom_ast_generator: any
  tom_d4rt_exec: any

dartnative:
  config:
    # Use the CLI LLDB path instead of Xcode automation on physical iOS
    # devices (Xcode 26+). Overrides the global
    # `dn config --no-enable-lldb-debugging` setting for this project.
    # enable-lldb-debugging: true
  assets:
    - assets/dn-logo.png

dependency_overrides:
  # DartNative: local patch of riverpod 3.3.2 that swaps `package:test` for
  # `test_api`. Upstream fixed this in 3.4.3, but that requires SDK 3.12
  # stable. See third_party/riverpod/pubspec.yaml for the full patch note.
  riverpod:
    path: third_party/riverpod
  tom_d4rt_ast:
    path: pkgs/tom_d4rt_ast
