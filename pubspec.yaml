name: dartnative_go
description: "A new DartNative project."
publish_to: "none"
version: 0.1.0+1

executables:
  dngo: dngo

workspace:
  - example
  - pkgs/dartnative_go_api
  - pkgs/dartnative_go_ui
  - pkgs/dartnative_go_config

environment:
  sdk: ^3.9.0-0

dependencies:
  dartnative_go_config:
    path: pkgs/dartnative_go_config
  xml: ^6.6.1
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  # == Supported plugins starts ===
  native_bottomsheet:
    path: ../dartnative_bottomsheet
  dartnative_share: ^1.0.0
  dartnative_webview: ^1.0.0
  dartnative_shared_preferences: ^1.0.0
  dartnative_path_provider: ^1.0.0
  dartnative_url_launcher: ^1.0.0
  dartnative_splash: ^1.0.0
  dartnative_notifications: ^1.0.0
  dartnative_system: ^1.0.0
  dartnative_connectivity: ^1.0.0
  dartnative_media_picker: ^1.1.0
  dartnative_background: ^1.0.0
  app_links_kit: ^0.1.0
  # Playground parity: every first-party plugin the upstream `playground`
  # app imports. Bridges for these live in buildkit{,_ast}.yaml.
  dartnative_skia: ^1.0.0
  dartnative_sqlite: ^1.0.0
  dartnative_secure_storage: ^1.0.0
  dartnative_hive: ^2.0.0
  dartnative_social_sign_in: ^1.0.0
  dartnative_firebase: ^1.0.0
  dartnative_video_player: ^1.3.0
  dartnative_audio: ^1.0.0
  dartnative_permissions: ^1.0.0
  dartnative_camera: ^1.1.0
  dartnative_image_crop: ^1.0.0
  dartnative_compressor: ^1.0.0
  dartnative_supertonic_tts: ^1.0.0
  dartnative_lottie: ^1.3.0
  crypto: ^3.0.0
  dio: ^5.0.0
  riverpod_kit: ^0.1.0
  riverpod: ^3.3.2
  # == Supported plugins ends ===
  tom_d4rt: any
  tom_d4rt_ast: any
  tom_ast_model: any
  analyzer: any
  yaml: ^3.1.2
  dartnative_go_api:
    path: pkgs/dartnative_go_api
  dartnative_go_ui:
    path: pkgs/dartnative_go_ui
  dartnative_live_activities: ^0.1.0
  quick_actions_kit: ^0.1.0
  local_auth_kit: ^0.2.0
  # dartnative_home_widget: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  image: 4.3.0
  test: any
  tom_d4rt_generator: any
  tom_ast_generator: any
  tom_d4rt_exec: any

dartnative:
  config:
    # Use the CLI LLDB path instead of Xcode automation on physical iOS
    # devices (Xcode 26+). Overrides the global
    # `dn config --no-enable-lldb-debugging` setting for this project.
    # enable-lldb-debugging: true
  assets:
    - assets/app-logo.png
    - assets/dn-logo.png

dependency_overrides:
  # DartNative: local patch of riverpod 3.3.2 that swaps `package:test` for
  # `test_api`. Upstream fixed this in 3.4.3, but that requires SDK 3.12
  # stable. See third_party/riverpod/pubspec.yaml for the full patch note.
  riverpod:
    path: third_party/riverpod
  tom_d4rt_ast:
    path: pkgs/tom_d4rt_ast
