name: dartnative_go
description: "A new DartNative project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0-192.0.dev

# Plain version deps: `dn pub get` resolves DartNative packages from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  # == Supported plugins starts ===
  dartnative_share: ^1.0.0
  dartnative_webview: ^1.0.0
  # dartnative_shared_preferences: ^1.0.1
  # Auth: Supabase session handling plus the native Apple and Google sign in.
  dartnative_supabase: ^1.0.0
  dartnative_social_sign_in: ^1.0.0

  # Storage: key value preferences and the SQLite database.
  dartnative_shared_preferences: ^1.0.0
  dartnative_sqlite: ^1.0.0
  dartnative_path_provider: ^1.0.0

  # Reads the bundled .dnkeys file (your Supabase URL and keys live there).
  dartnative_keys: ^1.0.0

  # Opens links in the system browser (the drawer's website item).
  dartnative_url_launcher: ^1.0.0

  # Branded launch splash.
  dartnative_splash: ^1.0.0

  # Used by the Apple sign in nonce (sha256).
  crypto: ^3.0.0
  # == Supported plugins ends ===
  tom_d4rt: any
  analyzer: any
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  image: ^4.0.0
  tom_d4rt_generator: any

dartnative:
  assets:
    - assets/dn-logo.png

# Branded launch splash + app icon: add the dartnative_splash plugin from
# dartpub.dev, then see tool/generate_app_assets.dart.
