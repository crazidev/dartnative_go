# Template for pre-compiled AST bundles (opt-in `tom_d4rt_ast` testing).
#
# The bundle target is always an EXTERNAL guest project — never this host
# shell (`lib/` here imports FFI registrants and cannot bundle).
# Preferred command (resolves entry + package name automatically):
#   dart run tool/build_ast_bundle.dart --project=/path/to/app
#
# The declarative form below is for CI (`astgen build --config`):
#   1. Copy this file into the guest project (or point --project at it).
#   2. `entry` mirrors the dev server fallback: lib/main.dart, then guest_app/.
#   3. `output` must land where the dev server serves it:
#      .dart_tool/bundles/guest.ast (see `kAstBundleRelativePath` in
#      `lib/src/cli/packaging/ast_artifact_paths.dart`).
targets:
  guest_main:
    entry: lib/main.dart
    output: .dart_tool/bundles/guest.ast
    compression: gzip
    include_sources: false
