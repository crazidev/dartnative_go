name: dartnative_go_ui
description: DartNative Go host UI. Preview it with dart_go start; the shell embeds the same widgets.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0-0

resolution: workspace

dependencies:
  dartnative: ^1.0.0
  dartnative_go_api:
    path: ../dartnative_go_api
  native_bottomsheet:
    path: ../../../dartnative_bottomsheet

dev_dependencies:
  lints: ^6.0.0

dartnative:
  assets:
    - assets/dn-logo.png
