d4rtgen:
  name: dartnative_go
  helpersImport: package:tom_d4rt/tom_d4rt.dart
  generateBarrel: true
  barrelPath: lib/d4rt_bridges.b.dart
  generateDartscript: true
  dartscriptPath: lib/src/interpreter/dartscript.b.dart
  registrationClass: DartnativeGoBridges
  generateProxies: true
  relaxerOutputPath: lib/src/interpreter/relaxers.b.dart
  yieldVoidCallbacks: true
  modules:
    - name: dartnative_ui
      barrelFiles:
        - package:dartnative/dartnative.dart
      barrelImport: package:dartnative/dartnative.dart
      outputPath: lib/src/interpreter/dartnative_bridges.b.dart
    - name: dartnative_webview
      barrelFiles:
        - package:dartnative_webview/dartnative_webview.dart
      barrelImport: package:dartnative_webview/dartnative_webview.dart
      outputPath: lib/src/interpreter/dartnative_webview_bridges.b.dart
    - name: dartnative_share
      barrelFiles:
        - package:dartnative_share/dartnative_share.dart
      barrelImport: package:dartnative_share/dartnative_share.dart
      outputPath: lib/src/interpreter/dartnative_share_bridges.b.dart
