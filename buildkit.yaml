d4rtgen:
  name: dartnative_go
  helpersImport: package:tom_d4rt/tom_d4rt.dart
  generateBarrel: true
  barrelPath: lib/d4rt_bridges.b.dart
  generateDartscript: true
  dartscriptPath: lib/src/interpreter/dartscript.b.dart
  registrationClass: DartnativeGoBridges
  generateProxies: true
  relaxerOutputPath: lib/src/interpreter/relaxers.b.dart
  yieldVoidCallbacks: true
  modules:
    - name: dartnative_ui
      barrelFiles:
        - package:dartnative/dartnative.dart
      barrelImport: package:dartnative/dartnative.dart
      outputPath: lib/src/interpreter/dartnative_bridges.b.dart
    - name: dartnative_webview
      barrelFiles:
        - package:dartnative_webview/dartnative_webview.dart
      barrelImport: package:dartnative_webview/dartnative_webview.dart
      outputPath: lib/src/interpreter/dartnative_webview_bridges.b.dart
    - name: dartnative_share
      barrelFiles:
        - package:dartnative_share/dartnative_share.dart
      barrelImport: package:dartnative_share/dartnative_share.dart
      outputPath: lib/src/interpreter/dartnative_share_bridges.b.dart
    - name: dartnative_shared_preferences
      barrelFiles:
        - package:dartnative_shared_preferences/dartnative_shared_preferences.dart
      barrelImport: package:dartnative_shared_preferences/dartnative_shared_preferences.dart
      outputPath: lib/src/interpreter/dartnative_shared_preferences_bridges.b.dart
    - name: dartnative_path_provider
      barrelFiles:
        - package:dartnative_path_provider/dartnative_path_provider.dart
      barrelImport: package:dartnative_path_provider/dartnative_path_provider.dart
      outputPath: lib/src/interpreter/dartnative_path_provider_bridges.b.dart
    - name: dartnative_url_launcher
      barrelFiles:
        - package:dartnative_url_launcher/dartnative_url_launcher.dart
      barrelImport: package:dartnative_url_launcher/dartnative_url_launcher.dart
      outputPath: lib/src/interpreter/dartnative_url_launcher_bridges.b.dart
    - name: dartnative_splash
      barrelFiles:
        - package:dartnative_splash/dartnative_splash.dart
      barrelImport: package:dartnative_splash/dartnative_splash.dart
      outputPath: lib/src/interpreter/dartnative_splash_bridges.b.dart
    - name: crypto
      barrelFiles:
        - package:crypto/crypto.dart
      barrelImport: package:crypto/crypto.dart
      outputPath: lib/src/interpreter/crypto_bridges.b.dart
    - name: native_bottomsheet
      barrelFiles:
        - package:native_bottomsheet/native_bottomsheet.dart
      barrelImport: package:native_bottomsheet/native_bottomsheet.dart
