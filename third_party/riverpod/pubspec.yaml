name: riverpod
description: >
  A reactive caching and data-binding framework.
  Riverpod makes working with asynchronous code a breeze.
version: 3.3.2
# DartNative: vendored LOCAL PATCH of riverpod 3.3.2.
#
# The shipped 3.3.2 depends on `package:test`, which drags the entire test
# runner (test_core, matcher, coverage, vm_service, ...) into every AOT
# product build. Upstream fixed this in 3.4.3 by switching to `test_api`, but
# that line requires SDK >= 3.12.0 stable, which this toolchain cannot resolve
# yet. This copy is unmodified except for that dependency swap:
#   - test: ^1.0.0        -> test_api: ^0.7.0
#   - lib/src/framework.dart imports test_api/scaffolding.dart
# `ProviderContainer.test` keeps the same addTearDown semantics.
homepage: https://riverpod.dev
repository: https://github.com/rrousselGit/riverpod
issue_tracker: https://github.com/rrousselGit/riverpod/issues
funding:
  - https://github.com/sponsors/rrousselGit/
topics:
  - state-management
  - caching
  - dependency-injection
  - riverpod

environment:
  sdk: ^3.7.0


dependencies:
  async: ^2.12.0
  clock: ^1.1.1
  collection: ^1.18.0
  meta: ^1.15.0
  stack_trace: ^1.12.1
  state_notifier: ">=0.7.2 <2.0.0"
  test_api: ^0.7.0
  uuid: ^4.5.1

dev_dependencies:
  analyzer: ^12.0.0
  build_runner: ^2.11.0
  expect_error: ^1.0.0
  mockito: ^5.0.0
  path: ^1.9.0
  riverpod_devtool_generator: ^0.0.0
  trotter: ^2.0.0-dev.1
