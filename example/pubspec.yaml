name: example
description: "A new DartNative project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0-192.0.dev

# Plain version deps: `dn pub get` resolves DartNative packages from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  ffi: ^2.1.4
  meta: ^1.17.0
  riverpod_kit:
    hosted: https://dartpub.dev
    version: ^0.1.0
  native_bottomsheet:
    path: ../../dartnative_bottomsheet
  dartnative_go:
    path: ../

  # dartnative_system: ^1.0.0
  # dartnative_connectivity: ^1.0.0
  # dartnative_media_picker: ^1.1.0
  # dartnative_background: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  # Pinned exact: dartnative_splash 1.0.1 (SDK) needs image 4.3.0 (mirrors
  # the root pubspec).
  image: 4.3.0

# Which Skia binary ships with the app. Pick one; see the Skia page.
#
#   bare  canvas, SkSL shaders and Latin text        about 4 MB on iPhone
#   full  bare, plus shaped text drawn inside a      about 9 MB on iPhone
#         Skia canvas: Arabic, CJK, right-to-left
#
# dartnative_skia:
#   variant: bare
#   # variant: full

dartnative:
  assets:
    - assets/dn-logo.png

# Branded launch splash + app icon: add the dartnative_splash plugin from
# dartpub.dev, then see tool/generate_app_assets.dart.

dependency_overrides:
  # Core SDK packages materialized by `dn` into this app's own
  # .dart_tool/dartnative_sdk (3 packages only).
  dartnative:
    path: .dart_tool/dartnative_sdk/dartnative
  dartnative_android:
    path: .dart_tool/dartnative_sdk/dartnative_android
  dartnative_ios:
    path: .dart_tool/dartnative_sdk/dartnative_ios
  # First-party plugins are NOT in .dart_tool/dartnative_sdk — `dn` layers
  # them into .dart_tool/dn_plugins. The root app's copy
  # (../.dart_tool/dn_plugins, populated by the root `dn pub get` which runs
  # first) is used here so plain `dart pub` (which `dn` runs for `example/`)
  # can resolve the transitive plugin deps from dartnative_go via path.
  # The `dartnative`/`dartnative_android`/`dartnative_ios` overrides above
  # also cover the plugins' own `path: ../dartnative` relative deps, which
  # don't exist inside dn_plugins.
  dartnative_shared_preferences:
    path: ../.dart_tool/dn_plugins/dartnative_shared_preferences
  dartnative_splash:
    path: ../.dart_tool/dn_plugins/dartnative_splash
  dartnative_notifications:
    path: ../.dart_tool/dn_plugins/dartnative_notifications
  dartnative_system:
    path: ../.dart_tool/dn_plugins/dartnative_system
  dartnative_url_launcher:
    path: ../.dart_tool/dn_plugins/dartnative_url_launcher
  dartnative_path_provider:
    path: ../.dart_tool/dn_plugins/dartnative_path_provider
  dartnative_connectivity:
    path: ../.dart_tool/dn_plugins/dartnative_connectivity
  dartnative_webview:
    path: ../.dart_tool/dn_plugins/dartnative_webview
  dartnative_media_picker:
    path: ../.dart_tool/dn_plugins/dartnative_media_picker
  dartnative_share:
    path: ../.dart_tool/dn_plugins/dartnative_share
  dartnative_background:
    path: ../.dart_tool/dn_plugins/dartnative_background
  # Same vendored fork as the root app (relaxes archive to the SDK's 3.6.1,
  # which dartnative_splash 1.0.1 requires). Without this, the transitive
  # tom_d4rt_ast (via dartnative_go) pulls archive ^4.0.9 and resolution
  # fails.
  tom_d4rt_ast:
    path: ../pkgs/tom_d4rt_ast