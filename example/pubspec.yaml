name: example
description: "A new DartNative project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0-192.0.dev
resolution: workspace

# Plain version deps: `dn pub get` resolves DartNative packages from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  ffi: ^2.1.4
  meta: ^1.17.0
  riverpod_kit:
    hosted: https://dartpub.dev
    version: ^0.1.0
  native_bottomsheet:
    path: ../../dartnative_bottomsheet
  dartnative_go:
    path: ../
  get_it: ^9.3.0

  dartnative_system: ^1.0.0
  dartnative_connectivity: ^1.0.0
  dartnative_media_picker: ^1.1.0
  dartnative_background: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  # Pinned exact: dartnative_splash 1.0.1 (SDK) needs image 4.3.0 (mirrors
  # the root pubspec).
  image: 4.3.0

dartnative:
  assets:
    - assets/dn-logo.png
